<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc"><title id="title">AlphaMap open audit sample coverage</title><desc id="desc">The twelve open-sample events cover Micron six, NVIDIA two, Vertiv two, Broadcom two, Marvell zero, and Arista zero. Claim types are nine issuer-reported actuals, two forward statements, and one relationship assertion. Directions are ten positive, one negative, and one neutral. This is not an inferential panel.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111e"/><stop offset="1" stop-color="#0d2036"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000814" flood-opacity=".45"/></filter></defs><rect width="1280" height="620" rx="28" fill="url(#bg)"/><text x="60" y="65" fill="#f2c879" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="750" letter-spacing="2.4">OPEN AUDIT SAMPLE V1 • COVERAGE</text><text x="60" y="112" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="750">Small enough to audit record by record</text><text x="60" y="145" fill="#9cb0c2" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">Securities without seeded audit events stay as zeros for pipeline testing.</text><rect x="60" y="190" width="708" height="352" rx="22" fill="#0e2136" stroke="#284563"/><text x="92" y="230" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="750">Canonical events by subject issuer</text><text x="92" y="282" fill="#c3d0dc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="650">Micron</text><text x="