<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">AlphaMap HBM3E propagation example</title><desc id="desc">Actual open-sample event EVT004 propagates from Micron to NVIDIA through confirmed relationship REL001. At the March 1, 2024 formation, EVT004's decayed direct contribution is 0.897 and NVIDIA propagated momentum is 0.224, yielding a cross-sectional feature of 0.50. These are feature units, not returns.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111e"/><stop offset="1" stop-color="#0d2036"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000814" flood-opacity=".45"/></filter></defs><rect width="1280" height="720" rx="28" fill="url(#bg)"/><text x="60" y="65" fill="#f2c879" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="750" letter-spacing="2.4">ACTUAL OPEN-SAMPLE TRACE • EVT004 / REL001</text><text x="60" y="112" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="750">One supplier disclosure, two inspectable feature paths</text><text x="60" y="145" fill="#9cb0c2" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">Micron HBM3E volume production for NVIDIA H200 • 26 February 2024</text>
