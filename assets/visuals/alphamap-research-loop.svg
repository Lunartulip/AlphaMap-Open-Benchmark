<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">AlphaMap evidence-to-testable-signal research loop</title><desc id="desc">A five-stage workflow from first-party evidence through point-in-time normalization, supply-graph propagation, weekly features, and a four-week relative-return test. The audit sample contains 11 first-party documents, 12 events, 15 observations, 2 confirmed edges, and 6 securities. No return claim is made.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111e"/><stop offset="1" stop-color="#0d2036"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000814" flood-opacity=".45"/></filter></defs><rect width="1280" height="640" rx="28" fill="url(#bg)"/><text x="64" y="68" fill="#f2c879" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="750" letter-spacing="2.5">ALPHAMAP • RESEARCH ARCHITECTURE</text><text x="64" y="118" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="38" font-weight="750">From supplier evidence to a falsifiable signal</text><text x="64" y="151" fill="#a7b8c9" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">Every transition is timestamped, inspectable and reproducible.</text><path d="M250 300h35" stroke="#7e94ac" stroke-width="2"/><path d="m277 294 9 6-9 6" fill="none" stroke="#7e94ac" stroke-width="2"/><path d="M484 300h35" stroke="#7e94ac" stroke-width="2"/><path d="m511 294 9 6-9 6" fill="none" stroke="#7e94ac" stroke-width="2"/><path d="M718 300h35" stroke="#7e94ac" stroke-width="2"/><path d="m745 294 9 6-9 6" fill="none" stroke="#7e94ac" stroke-width="2"/><path d="M952 300h35" stroke="#7e94ac" stroke-width="2"/><path d="m979 294 9 6-9 6" fi