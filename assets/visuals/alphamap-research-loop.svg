fill="#10243b" stroke="#284563" stroke-opacity=".75"/></g><circle cx="556" cy="248" r="18" fill="#193657"/><text x="556" y="254" text-anchor="middle" fill="#fff0c2" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="750">03</text><text x="544" y="300" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="700">Supply-graph</text><text x="544" y="326" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="700">propagation</text><text x="544" y="360" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">confirmed, matched, time-valid</text><g filter="url(#sh)"><rect x="754" y="210" width="198" height="178" rx="18" fill="#10243b" stroke="#284563" stroke-opacity=".75"/></g><circle cx="790" cy="248" r="18" fill="#193657"/><text x="790" y="254" text-anchor="middle" fill="#fff0c2" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="750">04</text><text x="778" y="300" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="700">Weekly</text><text x="778" y="326" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="700">cross-section</text><text x="778" y="360" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">28-day decay; zeros retained</text><g filter="url(#sh)"><rect x="988" y="210" width="240" height="178" rx="18" fill="#10243b" stroke="#d9a951" stroke-opacity=".75"/></g><circle cx="1024" cy="248" r="18" fill="#4b3b20"/><text x="1024" y="254" text-anchor="middle" fill="#fff0c2" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="750">05</text><text x="1012" y="300" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="700">4-week relative</text><text x="1012" y="326" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="700">return test</text><text x="1012" y="360" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">user prices; fixed falsifiers</text><rect x="52" y="430" width="1176" height="96" rx="18" fill="#0b1a2c" stroke="#233e59"/><text x="156" y="476" text-anchor="middle" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="750">11</text><text x="156" y="504" text-anchor="middle" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">first-party documents</text><text x="386" y="476" text-anchor="middle" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="750">12</text><text x="386" y="504" text-anchor="middle" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">canonical events</text><text x="616" y="476" text-anchor="middle" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="750">15</text><text x="616" y="504" text-anchor="middle" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">atomic observations</text><text x="846" y="476" text-anchor="middle" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="750">2</text><text x="846" y="504" text-anchor="middle" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">confirmed supply edges</text><text x="1076" y="476" text-anchor="middle" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="750">6</text><text x="1076" y="504" text-anchor="middle" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">listed securities</text><rect x="52" y="557" width="392" height="35" rx="17.5" fill="#1b2d36" stroke="#2ec4b6" stroke-opacity=".55"/><text x="248" y="580" text-anchor="middle" fill="#76d8cf" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750" letter-spacing=".8">AUDIT SAMPLE • SIGNAL MECHANICS • NO RETURN CLAIM</text><text x="1228" y="580" text-anchor="end" fill="#71879c" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Open sample v1 • SCEM-4W-v2</text></svg>