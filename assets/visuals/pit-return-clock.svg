<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" role="img" aria-labelledby="title desc"><title id="title">AlphaMap point-in-time return clock</title><desc id="desc">Event EVT004 moves from source publication at 12:00 UTC on February 26, 2024 to conservative availability at 12:15, earliest tradability at 14:30, Friday formation on March 1, then the first observed adjusted close strictly after formation and a 20-session outcome. Market prices are user-supplied.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111e"/><stop offset="1" stop-color="#0d2036"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000814" flood-opacity=".45"/></filter></defs><rect width="1280" height="570" rx="28" fill="url(#bg)"/><text x="60" y="65" fill="#f2c879" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="750" letter-spacing="2.4">POINT-IN-TIME RETURN CLOCK • EVT004</text><text x="60" y="112" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="750">The signal cannot travel backward in time</text><text x="60" y="145" fill="#9cb0c2" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">Evidence enters a portfolio only after its recorded tradable time.</text><rect x="60" y="190" width="1160" height="224" rx="22" fill="#0d2035" stroke="#284563"/><line x1="128" y1="282" x2="1152" y2="282" stroke="#5b8cff" stroke-width="4"/><circle cx="128" cy="282" r="10" fill="#f2c879"/><text x="128" y="236" text-anchor="middle" fill="#f2c879" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="750">PUBLISHED</text><text x="128" y="324" text-anchor="middle" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750">26 Feb • 12:00Z</text><text x="128" y="346" text-anchor="middle" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">issuer wire</text><circle cx="343" cy="282" r="10" fill="#d9a951"/><text x="343" y="236" text-anchor="middle" fill="#d9a951" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="750">AVAILABLE</text><text x="343" y="324" text-anchor="middle" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750">26 Feb • 12:15Z</text><text x="343" y="346" text-anchor="middle" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">conservative buffer</text><circle cx="558" cy="282" r="10" fill="#2ec4b6"/><text x="558" y="236" text-anchor="middle" fill="#2ec4b6" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="750">TRADABLE</text><text x="558" y="324" text-anchor="middle" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750">26 Feb • 14:30Z</text><text x="558" y="346" text-anchor="middle" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">first eligible instant</text><circle cx="779" cy="282" r="10" fill="#5b8cff"/><text x="779" y="236" text-anchor="middle" fill="#5b8cff" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="750">FORMATION</text><text x="779" y="324" text-anchor="middle" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750">01 Mar • 23:59:59Z</text><text x="779" y="346" text-anchor="middle" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">weekly Friday anchor</text><circle cx="986" cy="282" r="10" fill="#788bff"/><text x="986" y="236" text-anchor="middle" fill="#788bff" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="750">EXECUTION</text><text x="986" y="324" text-anchor="middle" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750">first observed close</text><text x="986" y="346" text-anchor="middle" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">strictly after formation</text><circle cx="1152" cy="282" r="10" fill="#9a7bff"/><text x="1152" y="236" text-anchor="middle" fill="#9a7bff" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="750">OUTCOME</text><text x="1152" y="324" text-anchor="middle" fill="#f4f7fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750">+20 sessions</text><text x="1152" y="346" text-anchor="middle" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">relative return</text><rect x="60" y="448" width="356" height="58" rx="16" fill="#10243b" stroke="#2ec4b6"/><text x="86" y="474" fill="#76d8cf" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750">NO FRIDAY-CLOSE REUSE</text><text x="86" y="493" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">execution must be after formation</text><rect x="462" y="448" width="356" height="58" rx="16" fill="#10243b" stroke="#5b8cff"/><text x="488" y="474" fill="#9ab6ff" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750">USER-SUPPLIED PRICES</text><text x="488" y="493" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">no market data is redistributed</text><rect x="864" y="448" width="356" height="58" rx="16" fill="#10243b" stroke="#d9a951"/><text x="890" y="474" fill="#f2c879" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750">RECONSTRUCTION LABELED</text><text x="890" y="493" fill="#91a4b7" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">timestamp basis stays explicit</text><text x="60" y="541" fill="#71879c" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">The clock is part of the data contract, not a chart annotation.</text></svg>